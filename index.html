<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8">
  <meta name="description" content="입소노트 사용성 테스트 — 상황을 살펴보고 자유롭게 탐색해 주세요.">
  <title>입소노트 · 사용성 테스트</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#phone-screen">앱 화면으로 바로 가기</a>
  <header class="study-header">
    <a class="study-brand" href="./"><span class="brand-symbol" aria-hidden="true"></span>입소노트 <span class="study-label">사용성 테스트</span></a>
    <div class="header-actions"><span class="preview-badge">시뮬레이션</span><button class="text-button" data-action="open-settings">미리보기 설정</button><button class="text-button" data-action="restart">다시 시작</button></div>
  </header>
  <div class="preview-notice" id="preview-notice">연습용 화면입니다. 답변은 이 기기에 임시 저장되며 연구자에게 전송되지 않습니다.</div>
  <main class="study-layout" id="study-layout">
    <section class="scenario-panel" id="scenario-panel" aria-label="현재 과제와 상황"></section>
    <section class="device-column" aria-label="입소노트 앱 시뮬레이션">
      <div class="device" id="device">
        <div class="os-bar"><time id="korea-clock" aria-label="한국 현재 시각"></time><div class="os-signals" aria-hidden="true"><svg viewBox="0 0 19 14"><path d="M1 10h3v4H1zm5-3h3v7H6zm5-3h3v10h-3zm5-3h3v13h-3z"/></svg><svg viewBox="0 0 20 15"><path d="M1 5a14 14 0 0 1 18 0l-2 2A11 11 0 0 0 3 7zm4 4a8 8 0 0 1 10 0l-2 2a5 5 0 0 0-6 0zm3 4a3 3 0 0 1 4 0l-2 2z"/></svg><span class="battery"><i></i></span></div></div>
        <div class="phone-scroll" id="phone-screen" tabindex="-1"></div>
        <nav class="app-nav" id="app-nav" aria-label="앱 메뉴"></nav>
        <div class="app-toast" id="app-toast" role="status" aria-live="polite"></div>
      </div>
      <p class="device-caption">입소노트 · 보호자 앱</p>
    </section>
    <aside class="question-panel" id="question-panel" aria-labelledby="question-heading"></aside>
  </main>
  <button class="question-fab" id="question-fab" data-action="open-questions" aria-controls="question-panel" aria-expanded="false">질문·응답 <span id="answer-count"></span></button>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden data-action="close-questions"></div>
  <dialog id="main-dialog" aria-labelledby="dialog-heading"></dialog>
  <noscript><p class="noscript">테스트를 진행하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
